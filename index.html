<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Pearl V1.11</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <section id="frame" aria-label="The Pearl generative paper simulation">
      <div id="paper">
        <canvas id="canvas"></canvas>
      </div>
    </section>

    <section id="controls" aria-label="Simulation controls">
      <label class="control">
        <span>Colour</span>
        <input id="colourRate" type="range" min="0" max="100" value="50" />
        <output id="colourValue">50</output>
      </label>

      <label class="control">
        <span>Water</span>
        <input id="waterRate" type="range" min="0" max="100" value="18" />
        <output id="waterValue">18</output>
      </label>

      <label class="control scale-control">
        <span>Scale</span>
        <select id="scaleSelect">
    <option value="minor">Minor</option>
    <option value="major">Major</option>
    <option value="dorian">Dorian</option>
    <option value="lydian">Lydian</option>
    <option value="mixolydian">Mixolydian</option>
    <option value="pentatonic">Pentatonic</option>
    <option value="wholetone">Whole tone</option>
	<option value="ragatodi">Raga Todi</option>
</select>
      </label>

      <button id="startButton" type="button">Start</button>
      <button id="clearButton" type="button">Clear</button>
	  <button id="soundModeBtn">Sane</button>
    </section>
  </main>

  <script src="script.js"?V1.11></script>
</body>
</html>
