<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Pearl V1.0</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <section id="frame" aria-label="The Pearl generative paper simulation">
      <div id="paper">
        <canvas id="canvas"></canvas>
      </div>
    </section>

    <section id="controls" aria-label="Simulation controls">
      <label class="control">
        <span>Colour</span>
        <input id="colourRate" type="range" min="0" max="100" value="42" />
        <output id="colourValue">42</output>
      </label>

      <label class="control">
        <span>Water</span>
        <input id="waterRate" type="range" min="0" max="100" value="18" />
        <output id="waterValue">18</output>
      </label>

      <label class="control scale-control">
        <span>Scale</span>
        <select id="scaleSelect" disabled title="Audio will be added later">
          <option>Minor</option>
          <option>Major</option>
          <option>Dorian</option>
          <option>Lydian</option>
          <option>Mixolydian</option>
          <option>Pentatonic</option>
          <option>Whole tone</option>
        </select>
      </label>

      <button id="startButton" type="button">Start</button>
      <button id="clearButton" type="button">Clear</button>
    </section>
  </main>

  <script src="script.js"?V1.0></script>
</body>
</html>
